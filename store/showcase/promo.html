<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>promo</title>
<style>
  @font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:600;src:url(inter-latin-600-normal.woff2) format('woff2')}
  *{box-sizing:border-box} html,body{margin:0}
  body{width:440px;height:280px;overflow:hidden;font-family:Inter,"DejaVu Sans",sans-serif;color:#fff;
    background:linear-gradient(135deg,#4338ca,#7c3aed);display:flex;flex-direction:column;justify-content:center;padding:0 34px}
  .row{display:flex;align-items:center;gap:14px}
  img{width:56px;height:56px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-.02em}
  p{font-size:17px;font-weight:600;margin:14px 0 18px;opacity:.92;line-height:1.35}
  .ex{font:22px "DejaVu Sans",sans-serif;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;display:inline-block}
</style></head>
<body>
  <div class="row"><img src="icon128.png" alt=""><h1>Math Logic</h1></div>
  <p>Math &amp; logic notation, typed<br>right inside any AI chat.</p>
  <div><span class="ex">∀x ∈ ℝ, x² ≥ 0</span></div>
</body></html>
