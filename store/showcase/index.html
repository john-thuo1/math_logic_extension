<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math Logic showcase</title>
<style>
  @font-face{font-family:Inter;font-weight:400;src:url(inter-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:600;src:url(inter-latin-600-normal.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:700;src:url(inter-latin-700-normal.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2) format('woff2')}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font:16px/1.5 Inter,"DejaVu Sans",system-ui,sans-serif;color:#0f172a;background:#eef0fb}
  /* caption band */
  .cap{height:132px;display:flex;align-items:center;gap:22px;padding:0 64px;background:linear-gradient(120deg,#4338ca,#6d28d9);color:#fff}
  .cap img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .cap h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .cap p{margin:6px 0 0;font-size:19px;opacity:.9}
  .cap code{font:600 18px ui-monospace,"DejaVu Sans Mono",monospace;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:7px}
  /* neutral chat app */
  .app{height:668px;display:flex;margin:0 40px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 30px rgba(49,46,129,.15);overflow:hidden;margin-top:0}
  .side{width:220px;background:#f7f7f9;border-right:1px solid #ececf2;padding:18px 14px;font-size:14px;color:#475569}
  .side .new{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;font-weight:600;color:#0f172a;margin-bottom:18px}
  .side .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:14px 6px 6px}
  .side .it{padding:7px 8px;border-radius:8px}
  .side .it.on{background:#ebebf2;color:#0f172a}
  .main{flex:1;display:flex;flex-direction:column}
  .top{height:52px;border-bottom:1px solid #f0f0f4;display:flex;align-items:center;padding:0 24px;font-weight:600;color:#334155}
  .thread{flex:1;overflow:hidden;padding:26px 0 0}
  .col{width:720px;margin:0 auto}
  .msg{display:flex;margin:0 0 16px}
  .msg.me{justify-content:flex-end}
  .bub{max-width:560px;padding:11px 16px;border-radius:18px;font-size:17px}
  .me .bub{background:#f1f2f6}
  .ai .bub{padding-left:0;color:#1e293b}
  .composer-wrap{padding:0 0 26px}
  .composer{width:720px;margin:0 auto;border:1px solid #d7d9e0;border-radius:24px;padding:14px 18px 12px;box-shadow:0 2px 10px rgba(15,23,42,.06);background:#fff}
  .ed{min-height:30px;outline:none;font-size:18px;white-space:pre-wrap}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#94a3b8;font-size:13px}
  .send{width:34px;height:34px;border-radius:50%;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
</style>
</head>
<body>
  <div class="cap">
    <img src="icon128.png" alt="">
    <div><h1 id="title">Title</h1><p id="sub">Subtitle</p></div>
  </div>
  <div class="app">
    <div class="side">
      <div class="new">+ New chat</div>
      <div class="h">Today</div>
      <div class="it on">Real analysis homework</div>
      <div class="it">Proof by induction</div>
      <div class="it">Set theory questions</div>
      <div class="h">Yesterday</div>
      <div class="it">Discrete math review</div>
      <div class="it">Logic puzzle</div>
    </div>
    <div class="main">
      <div class="top">Real analysis homework</div>
      <div class="thread"><div class="col" id="thread"></div></div>
      <div class="composer-wrap">
        <div class="composer">
          <div class="ed" id="ed" contenteditable="true"></div>
          <div class="bar"><span>Ask anything</span><span class="send">↑</span></div>
        </div>
      </div>
    </div>
  </div>
<script>
  window.setScene = function (title, sub, msgs) {
    document.getElementById('title').innerHTML = title;
    document.getElementById('sub').innerHTML = sub;
    document.getElementById('thread').innerHTML = (msgs || []).map(function (m) {
      return '<div class="msg ' + m[0] + '"><div class="bub">' + m[1] + '</div></div>';
    }).join('');
    var ed = document.getElementById('ed');
    ed.innerHTML = '';
    ed.focus();
  };
</script>
</body>
</html>
