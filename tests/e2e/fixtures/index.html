<!doctype html>
<html><head><meta charset="utf-8"><title>MathLogic fixture</title>
<link rel="stylesheet" href="quill.snow.css">
<style>
  body{font:16px/1.4 sans-serif;margin:0;padding:16px}
  .ed{border:1px solid #bbb;min-height:44px;width:640px;margin:0 0 10px;padding:6px;box-sizing:border-box}
  #quill{height:auto}
  .ProseMirror{outline:none;min-height:30px;white-space:pre-wrap}
  #bottom{position:fixed;left:16px;bottom:8px;width:640px}
</style></head>
<body>
  <textarea id="ta" class="ed"></textarea>
  <input id="inp" class="ed" type="text">
  <input id="pwd" class="ed" type="password">
  <div id="ce" class="ed" contenteditable="true"></div>
  <div id="pm" class="ed"></div>
  <div id="quill" class="ed"></div>
  <div id="off" class="ed" contenteditable="true" data-mathlogic-off></div>
  <div id="bottom"><textarea id="low" class="ed" placeholder="composer pinned to the bottom, like ChatGPT"></textarea></div>
  <script src="editors.bundle.js"></script>
</body></html>
